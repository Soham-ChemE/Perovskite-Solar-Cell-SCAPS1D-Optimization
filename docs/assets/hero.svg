<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="ZnSe/CdTe thin-film cell in SCAPS-1D: simulated efficiency of ten electron-transport layers as bars growing in order, next to the headline numbers">
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h{font-size:54px;font-weight:800;fill:#e6edf3;letter-spacing:-1.5px}.sub{font-size:21px;fill:#8b98a9}.big{font-size:32px;font-weight:800;fill:#22d3ee}.small{font-size:16px;fill:#8b98a9}.foot{font-size:15px;fill:#5b6676}.ax{font-size:13px;fill:#8b98a9}.bl{font-size:14px;font-weight:700;opacity:0;animation:show 14s infinite}.bn{font-size:12px;fill:#8b98a9}
.br rect{transform:scaleY(0);animation:grow 14s infinite}
@keyframes grow{0%{transform:scaleY(0)}5%{transform:scaleY(1)}88%{transform:scaleY(1)}94%{transform:scaleY(0)}100%{transform:scaleY(0)}}
@keyframes show{0%{opacity:0}4%{opacity:1}86%{opacity:1}90%{opacity:0}100%{opacity:0}}
.b0 rect{transform-origin:959.0px 430.0px;animation-delay:0.0s}.b0 .bl{animation-delay:0.6s}
.b1 rect{transform-origin:1017.0px 430.0px;animation-delay:0.5s}.b1 .bl{animation-delay:1.1s}
.b2 rect{transform-origin:1075.0px 430.0px;animation-delay:1.0s}.b2 .bl{animation-delay:1.6s}
.b3 rect{transform-origin:1133.0px 430.0px;animation-delay:1.5s}.b3 .bl{animation-delay:2.1s}
.b4 rect{transform-origin:1191.0px 430.0px;animation-delay:2.0s}.b4 .bl{animation-delay:2.6s}
.b5 rect{transform-origin:1249.0px 430.0px;animation-delay:2.5s}.b5 .bl{animation-delay:3.1s}
.b6 rect{transform-origin:1307.0px 430.0px;animation-delay:3.0s}.b6 .bl{animation-delay:3.6s}
.b7 rect{transform-origin:1365.0px 430.0px;animation-delay:3.5s}.b7 .bl{animation-delay:4.1s}
.b8 rect{transform-origin:1423.0px 430.0px;animation-delay:4.0s}.b8 .bl{animation-delay:4.6s}
.b9 rect{transform-origin:1481.0px 430.0px;animation-delay:4.5s}.b9 .bl{animation-delay:5.1s}

.st{opacity:0;animation:cycle 16s infinite}.s1{animation-delay:4s}.s2{animation-delay:8s}.s3{animation-delay:12s}
@keyframes cycle{0%,22%{opacity:1}25%,97%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.br rect,.bl,.st{animation:none}.br rect{transform:none}.bl,.s0{opacity:1}}
</style>
<rect width="1600" height="500" fill="#0b1220"/>
<g class="t">
<text x="80" y="120" class="h">Swap the toxic buffer.</text><text x="80" y="178" class="h">Screen the rest.</text>
<text x="80" y="218" class="sub">SCAPS-1D device-physics study of an FTO / ZnSe / CdTe thin-film cell</text>
<g class="st s0"><text x="80" y="268" class="big">27.99 %</text><text x="80" y="300" class="small">best simulated efficiency: Cs₂BiAgI₆ electron-transport layer, Ni contact</text></g><g class="st s1"><text x="80" y="268" class="big">1.21 V · 25.96 mA/cm² · FF 89.3 %</text><text x="80" y="300" class="small">open-circuit voltage, short-circuit current, fill factor at the optimum</text></g><g class="st s2"><text x="80" y="268" class="big">10 ETLs · 9 metals</text><text x="80" y="300" class="small">screened in SCAPS-1D with ZnSe replacing the CdS window</text></g><g class="st s3"><text x="80" y="268" class="big">-1.66 mV/K</text><text x="80" y="300" class="small">V_OC temperature coefficient, 300 to 400 K; J_SC does not move</text></g>
<text x="80" y="420" class="foot">A ceiling for this parameter set, not a fabricated cell · every number from the raw SCAPS exports in the repository</text>
<text x="80" y="446" class="foot">Right: simulated efficiency of the ten electron-transport layers at their best thickness · open the live page for the 3D stack</text>
<rect x="930" y="70" width="580" height="360" fill="none" stroke="#1f2a3c"/>
<text x="918" y="250.0" class="ax" text-anchor="middle" transform="rotate(-90 918 250.0)">simulated PCE, %</text>
<g class="br b0"><rect x="939.9" y="100.1" width="38.3" height="329.9" rx="4" fill="#f87171"/><text class="t bl" x="959.0" y="92.1" text-anchor="middle" fill="#f87171">28.0</text><text class="t bn" x="959.0" y="448.0" text-anchor="middle">Cs₂BiAgI₆</text></g><g class="br b1"><rect x="997.9" y="105.9" width="38.3" height="324.1" rx="4" fill="#f59e0b"/><text class="t bl" x="1017.0" y="97.9" text-anchor="middle" fill="#f59e0b">27.5</text><text class="t bn" x="1017.0" y="448.0" text-anchor="middle">C₆₀</text></g><g class="br b2"><rect x="1055.9" y="154.0" width="38.3" height="276.0" rx="4" fill="#f59e0b"/><text class="t bl" x="1075.0" y="146.0" text-anchor="middle" fill="#f59e0b">23.4</text><text class="t bn" x="1075.0" y="448.0" text-anchor="middle">PC₁₆BM</text></g><g class="br b3"><rect x="1113.9" y="163.3" width="38.3" height="266.7" rx="4" fill="#f59e0b"/><text class="t bl" x="1133.0" y="155.3" text-anchor="middle" fill="#f59e0b">22.6</text><text class="t bn" x="1133.0" y="448.0" text-anchor="middle">Cu₂O</text></g><g class="br b4"><rect x="1171.9" y="187.7" width="38.3" height="242.3" rx="4" fill="#f59e0b"/><text class="t bl" x="1191.0" y="179.7" text-anchor="middle" fill="#f59e0b">20.6</text><text class="t bn" x="1191.0" y="448.0" text-anchor="middle">CuO</text></g><g class="br b5"><rect x="1229.9" y="188.4" width="38.3" height="241.6" rx="4" fill="#f59e0b"/><text class="t bl" x="1249.0" y="180.4" text-anchor="middle" fill="#f59e0b">20.5</text><text class="t bn" x="1249.0" y="448.0" text-anchor="middle">Sb₂Se₃</text></g><g class="br b6"><rect x="1287.9" y="265.1" width="38.3" height="164.9" rx="4" fill="#22d3ee"/><text class="t bl" x="1307.0" y="257.1" text-anchor="middle" fill="#22d3ee">14.0</text><text class="t bn" x="1307.0" y="448.0" text-anchor="middle">TiO₂</text></g><g class="br b7"><rect x="1345.9" y="334.4" width="38.3" height="95.6" rx="4" fill="#22d3ee"/><text class="t bl" x="1365.0" y="326.4" text-anchor="middle" fill="#22d3ee">8.1</text><text class="t bn" x="1365.0" y="448.0" text-anchor="middle">WO₃</text></g><g class="br b8"><rect x="1403.9" y="427.1" width="38.3" height="2.9" rx="4" fill="#64748b"/><text class="t bl" x="1423.0" y="419.1" text-anchor="middle" fill="#64748b">0.2</text><text class="t bn" x="1423.0" y="448.0" text-anchor="middle">PCBM</text></g><g class="br b9"><rect x="1461.9" y="427.1" width="38.3" height="2.9" rx="4" fill="#64748b"/><text class="t bl" x="1481.0" y="419.1" text-anchor="middle" fill="#64748b">0.2</text><text class="t bn" x="1481.0" y="448.0" text-anchor="middle">WS₂</text></g>
</g>
</svg>